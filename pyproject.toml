[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotoshu"
version = "0.1.0"
description = "Python client for the Kotoshu HTTP spell-check API"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Ribose Inc.", email = "open.source@ribose.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]
classifiers = [
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/kotoshu/kotoshu-python"
Source = "https://github.com/kotoshu/kotoshu-python"

[tool.setuptools.packages.find]
where = ["src"]
